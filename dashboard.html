<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🥫 Pantry</title>
<style>
  :root {
    --bg: #FEFCF3;
    --card: #FFFFFF;
    --sidebar-bg: #F8F4EC;
    --primary: #5B8C5A;
    --primary-light: #7BAD7A;
    --primary-50: #EDF7ED;
    --primary-100: #C3E6C4;
    --primary-500: #5B8C5A;
    --primary-600: #4A7A49;
    --primary-700: #3A6839;
    --accent: #D4A574;
    --warning: #E8A838;
    --danger: #C75050;
    --success: #2E7D32;
    --info: #5B8C9A;
    --text: #2D3436;
    --text-secondary: #636E72;
    --text-muted: #95A5A6;
    --muted: #95A5A6;
    --border: #E8E0D0;
    --border-focus: var(--primary-500);
    --expiring-bg: #FFF8E7;
    --done-bg: #F5F5F5;
    --shadow: 0 1px 4px rgba(0,0,0,0.08);
    --radius: 12px;
    /* Category colors */
    --cat-dairy: #E8F0FE;
    --cat-produce: #E6F4EA;
    --cat-meat: #FCE8E6;
    --cat-grains: #FFF8E1;
    --cat-snacks: #F3E8FD;
    --cat-condiments: #FFF3E0;
    --cat-frozen: #E0F7FA;
    --cat-beverages: #E8EAF6;
    --cat-meals: #FBE9E7;
    --cat-other: #F5F5F5;
    /* Category text colors */
    --cat-dairy-text: #1A56DB;
    --cat-produce-text: #2E7D32;
    --cat-meat-text: #C62828;
    --cat-grains-text: #F57F17;
    --cat-snacks-text: #6A1B9A;
    --cat-condiments-text: #E65100;
    --cat-frozen-text: #00838F;
    --cat-beverages-text: #283593;
    --cat-meals-text: #BF360C;
    --cat-other-text: #546E7A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.4;
    min-height: 100vh;
  }

  /* ── Page layout ── */
  .page-layout {
    display: block;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(to bottom, #FFF8F0, var(--bg));
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--bg);
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .icon-btn:hover { background: var(--border); }
  .icon-btn.primary-btn {
    background: var(--primary);
    color: white;
  }

  /* Hamburger — only shows on tablet (600-1024px) */
  .hamburger {
    display: none;
  }
  @media (min-width: 600px) and (max-width: 1024px) {
    .hamburger { display: flex; }
  }

  /* ── Stats bar (mobile/tablet) ── */
  .stats-bar {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .stats-bar .stat { display: flex; align-items: center; gap: 4px; }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-green { background: var(--primary); }
  .dot-amber { background: var(--warning); }
  .dot-red { background: var(--danger); }
  .dot-gray { background: var(--muted); }

  /* ── Search ── */
  .search-wrap { position: relative; margin-bottom: 10px; }
  .search-input {
    width: 100%;
    padding: 9px 14px 9px 36px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--border-focus); }
  .search-icon {
    position: absolute;
    left: 11px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 16px;
  }

  /* ── Sort row (mobile/tablet header) ── */
  .sort-row {
    display: flex;
    gap: 6px;
    align-items: center;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .sort-row::-webkit-scrollbar { display: none; }
  .sort-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .sort-btn {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--card);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    color: var(--text);
    transition: all 0.15s;
  }
  .sort-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    font-weight: 700;
  }

  /* ── Location tabs (mobile/tablet) ── */
  .tabs-wrap {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs-wrap::-webkit-scrollbar { display: none; }
  .tabs {
    display: flex;
    gap: 0;
  }
  .tab {
    padding: 10px 16px;
    border: none;
    background: none;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    color: var(--muted);
    border-bottom: 2.5px solid transparent;
    transition: all 0.15s;
  }
  .tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    font-weight: 600;
  }

  /* ── Category pill bar (mobile/tablet) ── */
  .cat-bar-wrap {
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .cat-bar-wrap::-webkit-scrollbar { display: none; }
  .cat-bar {
    display: flex;
    gap: 6px;
    align-items: center;
    min-width: max-content;
  }
  .cat-pill {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--card);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    color: var(--text-secondary);
    transition: all 0.15s;
    font-weight: 500;
  }
  .cat-pill:hover { border-color: var(--primary); color: var(--primary); }
  .cat-pill.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    font-weight: 700;
  }
  .cat-pill[data-cat="Dairy"].active { background: var(--cat-dairy); border-color: var(--cat-dairy-text); color: var(--cat-dairy-text); font-weight: 700; }
  .cat-pill[data-cat="Produce"].active { background: var(--cat-produce); border-color: var(--cat-produce-text); color: var(--cat-produce-text); font-weight: 700; }
  .cat-pill[data-cat="Meat & Protein"].active { background: var(--cat-meat); border-color: var(--cat-meat-text); color: var(--cat-meat-text); font-weight: 700; }
  .cat-pill[data-cat="Grains & Bakery"].active { background: var(--cat-grains); border-color: var(--cat-grains-text); color: var(--cat-grains-text); font-weight: 700; }
  .cat-pill[data-cat="Snacks"].active { background: var(--cat-snacks); border-color: var(--cat-snacks-text); color: var(--cat-snacks-text); font-weight: 700; }
  .cat-pill[data-cat="Condiments & Sauces"].active { background: var(--cat-condiments); border-color: var(--cat-condiments-text); color: var(--cat-condiments-text); font-weight: 700; }
  .cat-pill[data-cat="Frozen"].active { background: var(--cat-frozen); border-color: var(--cat-frozen-text); color: var(--cat-frozen-text); font-weight: 700; }
  .cat-pill[data-cat="Beverages"].active { background: var(--cat-beverages); border-color: var(--cat-beverages-text); color: var(--cat-beverages-text); font-weight: 700; }
  .cat-pill[data-cat="Meals & Prepared"].active { background: var(--cat-meals); border-color: var(--cat-meals-text); color: var(--cat-meals-text); font-weight: 700; }
  .cat-pill[data-cat="Other"].active { background: var(--cat-other); border-color: var(--cat-other-text); color: var(--cat-other-text); font-weight: 700; }

  /* ── Main content area (mobile default) ── */
  .content-area {
    display: block;
  }

  /* ── Sidebar ── */
  .sidebar {
    display: none; /* hidden on mobile/tablet */
  }

  /* ── Main content ── */
  .content { padding: 12px 12px 80px; max-width: 900px; margin: 0 auto; }

  /* ── Section heading ── */
  .section-heading {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 4px 6px;
  }
  .section-heading.expiring-heading {
    color: var(--warning);
    display: flex; align-items: center; gap: 6px;
  }

  /* ── Product cards ── */
  .products-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  @media (min-width: 600px) and (max-width: 1024px) {
    .products-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    overflow: hidden;
    transition: box-shadow 0.15s, opacity 0.2s;
  }
  .card:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
  .card.done-card {
    opacity: 0.55;
    background: var(--done-bg);
  }
  .card.expiring-card { border-left: 4px solid var(--warning); }
  .card.expired-card { border-left: 4px solid var(--danger); }

  .card-main {
    display: flex;
    align-items: center;
    padding: 16px;
    gap: 10px;
    cursor: pointer;
  }
  .card-emoji { font-size: 28px; flex-shrink: 0; width: 38px; text-align: center; }
  .card-info { flex: 1; min-width: 0; }
  .card-name {
    font-weight: 600;
    font-size: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-brand {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }
  .card-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .card-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  /* ── Quantity controls ── */
  .qty-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--bg);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    color: var(--primary);
    transition: all 0.1s;
    flex-shrink: 0;
  }
  .qty-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
  .qty-btn:active { transform: scale(0.9); }
  .qty-display {
    font-size: 16px;
    font-weight: 700;
    min-width: 22px;
    text-align: center;
    color: var(--text);
  }

  /* ── Done checkbox ── */
  .done-check {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: all 0.15s;
    flex-shrink: 0;
    background: var(--bg);
  }
  .done-check.checked {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }

  /* ── Expiry badge ── */
  .expiry-row {
    padding: 4px 14px 10px 62px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .expiry-badge {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
  }
  .expiry-badge.no-date {
    background: var(--bg);
    color: var(--muted);
    border: 1.5px dashed var(--border);
  }
  .expiry-badge.expiring {
    background: #FFF3CD;
    color: #856404;
    border: 1.5px solid #FFEAA7;
  }
  .expiry-badge.expired {
    background: #FDECEA;
    color: var(--danger);
    border: 1.5px solid #F5C6C6;
  }
  .expiry-badge.fresh {
    background: #EDF7ED;
    color: #2E7D32;
    border: 1.5px solid #C3E6C4;
  }
  input.expiry-input {
    font-size: 12px;
    border: 1.5px solid var(--primary);
    border-radius: 6px;
    padding: 2px 6px;
    background: white;
    color: var(--text);
    outline: none;
  }

  /* ── Detail expand ── */
  .card-detail {
    display: none;
    padding: 0 14px 14px 62px;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
  .card-detail.open { display: block; }
  .detail-section { margin-top: 10px; }
  .detail-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .nutrition-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .nutrition-item {
    background: var(--bg);
    border-radius: 8px;
    padding: 6px 8px;
    text-align: center;
  }
  .nutrition-item .val { font-size: 15px; font-weight: 700; color: var(--text); }
  .nutrition-item .lbl { font-size: 10px; color: var(--muted); }
  .ingredients-text {
    background: var(--bg);
    border-radius: 8px;
    padding: 8px;
    line-height: 1.5;
    color: var(--text);
  }
  .detail-actions { display: flex; gap: 8px; margin-top: 12px; }
  .detail-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
    transition: all 0.15s;
  }
  .detail-btn:hover { background: var(--border); }
  .detail-btn.danger { border-color: var(--danger); color: var(--danger); }
  .detail-btn.danger:hover { background: var(--danger); color: white; }

  /* ── Add modal ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 20px;
    width: 100%;
    max-width: 600px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 18px; margin-bottom: 16px; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .modal-field input, .modal-field select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    font-size: 15px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .modal-field input:focus, .modal-field select:focus { border-color: var(--border-focus); }
  .modal-actions { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-secondary { background: var(--border); color: var(--text); }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 64px 24px 48px;
    color: var(--muted);
    max-width: 320px;
    margin: 0 auto;
  }
  .empty-state .emoji { font-size: 56px; display: block; margin-bottom: 16px; line-height: 1; }
  .empty-state h3 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .empty-state p { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }
  .empty-state .empty-cta {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--primary); color: #fff;
    border: none; border-radius: 20px; padding: 10px 20px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.15s;
  }
  .empty-state .empty-cta:hover { background: var(--primary-600); }

  /* ── Error state ── */
  .error-state {
    text-align: center;
    padding: 64px 24px 48px;
    max-width: 320px;
    margin: 0 auto;
  }
  .error-state .emoji { font-size: 56px; display: block; margin-bottom: 16px; line-height: 1; }
  .error-state h3 { font-size: 18px; font-weight: 600; color: #B71C1C; margin-bottom: 8px; }
  .error-state p { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 20px; }
  .error-state .retry-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: #C75050; color: #fff;
    border: none; border-radius: 20px; padding: 10px 20px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.15s;
  }
  .error-state .retry-btn:hover { background: #B71C1C; }

  /* ── Skeleton loading ── */
  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .skeleton-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .skeleton-block {
    background: linear-gradient(90deg, #f0ede8 25%, #e8e3db 50%, #f0ede8 75%);
    background-size: 800px 100%;
    animation: shimmer 1.5s infinite linear;
    border-radius: 6px;
  }
  .skeleton-emoji { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
  .skeleton-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .skeleton-line-name { height: 16px; width: 65%; }
  .skeleton-line-brand { height: 12px; width: 40%; }
  .skeleton-line-badge { height: 20px; width: 80px; border-radius: 10px; }

  /* ── Out of stock badge ── */
  .oos-badge {
    display: inline-flex; align-items: center;
    background: var(--done-bg); color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 2px 8px;
    font-size: 11px; font-weight: 600;
    white-space: nowrap;
  }

  /* ── Stat filter (clickable stats bar) ── */
  .stat { cursor: pointer; padding: 4px 8px; border-radius: 12px; transition: background 0.15s; }
  .stat:hover { background: rgba(0,0,0,0.06); }
  .stat.active-filter { background: rgba(0,0,0,0.1); outline: 2px solid var(--border); }

  /* ── Sort direction arrow ── */
  .sort-btn .sort-arrow { font-size: 10px; opacity: 0.7; margin-left: 2px; }
  .sidebar-sort-btn .sort-arrow { font-size: 10px; opacity: 0.7; margin-left: 2px; }

  /* ── Location dropdown (like cat-dropdown) ── */
  .loc-badge-wrap { position: relative; display: inline-block; }
  .loc-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    z-index: 200;
    min-width: 140px;
    overflow: hidden;
  }
  .loc-dropdown.open { display: block; }
  .loc-dropdown-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    font-size: 13px; cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s;
  }
  .loc-dropdown-item:hover { background: var(--primary-50); }
  .loc-dropdown-item.selected { font-weight: 700; color: var(--primary); background: var(--primary-50); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #2D3436;
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    transition: transform 0.25s ease;
    z-index: 300;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── Saving indicator ── */
  .saving-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--primary);
    display: inline-block;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ── Location badge ── */
  .loc-badge {
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 10px;

<script>
const API = '';  // same origin
let products = [];
let currentTab = 'all';
let currentCategory = 'all';
let currentSort = 'name';
let expandedCards = new Set();
let saving = false;
let refreshTimer = null;
let isLoading = false;
let loadError = null;
let activeStatFilter = null; // 'expiring' | 'expired' | 'nodate' | null
let openLocationDropdownBarcode = null;
// Sort direction: default sane values per sort type
const sortDirection = { name: 'asc', expiry: 'asc', recent: 'desc', qty: 'desc' };

const CATEGORIES = [
  { id: 'Dairy',              emoji: '🥛', color: 'var(--cat-dairy)',      textColor: 'var(--cat-dairy-text)',       barColor: '#1A56DB' },
  { id: 'Produce',            emoji: '🥬', color: 'var(--cat-produce)',    textColor: 'var(--cat-produce-text)',     barColor: '#2E7D32' },
  { id: 'Meat & Protein',     emoji: '🥩', color: 'var(--cat-meat)',       textColor: 'var(--cat-meat-text)',        barColor: '#C62828' },
  { id: 'Grains & Bakery',    emoji: '🍞', color: 'var(--cat-grains)',     textColor: 'var(--cat-grains-text)',      barColor: '#F57F17' },
  { id: 'Snacks',             emoji: '🍿', color: 'var(--cat-snacks)',     textColor: 'var(--cat-snacks-text)',      barColor: '#6A1B9A' },
  { id: 'Condiments & Sauces',emoji: '🫙', color: 'var(--cat-condiments)', textColor: 'var(--cat-condiments-text)', barColor: '#E65100' },
  { id: 'Frozen',             emoji: '🧊', color: 'var(--cat-frozen)',     textColor: 'var(--cat-frozen-text)',      barColor: '#00838F' },
  { id: 'Beverages',          emoji: '🥤', color: 'var(--cat-beverages)',  textColor: 'var(--cat-beverages-text)',   barColor: '#283593' },
  { id: 'Meals & Prepared',   emoji: '🍲', color: 'var(--cat-meals)',      textColor: 'var(--cat-meals-text)',       barColor: '#BF360C' },
  { id: 'Other',              emoji: '📦', color: 'var(--cat-other)',      textColor: 'var(--cat-other-text)',       barColor: '#546E7A' },
];

function getCategoryInfo(catId) {
  return CATEGORIES.find(c => c.id === catId) || CATEGORIES[CATEGORIES.length - 1];
}

// Active dropdown state
let openDropdownBarcode = null;

const LOCATION_EMOJI_MAP = {
  fridge: '❄️', freezer: '🧊', pantry: '🥫', 'spice rack': '🌿',
  spices: '🌶️', snacks: '🍿', drinks: '🥤', produce: '🥦',
};

function locationEmoji(loc) {
  if (!loc) return '📦';
  const l = loc.toLowerCase();
  for (const [k, v] of Object.entries(LOCATION_EMOJI_MAP)) {
    if (l.includes(k)) return v;
  }
  return '📦';
}

// Keep old name for compatibility
function categoryEmoji(loc) { return locationEmoji(loc); }

function productEmoji(p) {
  const name = (p.name || '').toLowerCase();
  if (name.includes('milk') || name.includes('cream') || name.includes('butter')) return '🥛';
  if (name.includes('egg')) return '🥚';
  if (name.includes('bread') || name.includes('tortilla')) return '🍞';
  if (name.includes('cheese')) return '🧀';
  if (name.includes('chicken') || name.includes('turkey') || name.includes('poultry')) return '🍗';
  if (name.includes('beef') || name.includes('steak') || name.includes('burger')) return '🥩';
  if (name.includes('fish') || name.includes('salmon') || name.includes('tuna')) return '🐟';
  if (name.includes('pasta') || name.includes('noodle') || name.includes('spaghetti')) return '🍝';
  if (name.includes('rice') || name.includes('quinoa') || name.includes('grain')) return '🍚';
  if (name.includes('bean') || name.includes('lentil') || name.includes('chickpea')) return '🫘';
  if (name.includes('soup') || name.includes('broth') || name.includes('stock')) return '🍲';
  if (name.includes('sauce') || name.includes('ketchup') || name.includes('mustard')) return '🫙';
  if (name.includes('oil') || name.includes('vinegar')) return '🫒';
  if (name.includes('coffee') || name.includes('tea') || name.includes('espresso')) return '☕';
  if (name.includes('juice') || name.includes('smoothie')) return '🧃';
  if (name.includes('water') || name.includes('sparkling')) return '💧';
  if (name.includes('beer') || name.includes('wine') || name.includes('alcohol')) return '🍺';
  if (name.includes('chocolate') || name.includes('cocoa') || name.includes('candy')) return '🍫';
  if (name.includes('cookie') || name.includes('cracker') || name.includes('chip')) return '🍪';
  if (name.includes('cereal') || name.includes('oat') || name.includes('granola')) return '🥣';
  if (name.includes('yogurt') || name.includes('kefir')) return '🍶';
  if (name.includes('apple')) return '🍎';
  if (name.includes('banana')) return '🍌';
  if (name.includes('berry') || name.includes('raspberry') || name.includes('blueberry')) return '🫐';
  if (name.includes('tomato')) return '🍅';
  if (name.includes('onion') || name.includes('garlic')) return '🧅';
  if (name.includes('salt') || name.includes('pepper') || name.includes('spice') || name.includes('seasoning')) return '🧂';
  if (name.includes('flour') || name.includes('sugar') || name.includes('baking')) return '🫙';
  if (name.includes('honey') || name.includes('syrup') || name.includes('jam')) return '🍯';
  if (name.includes('nut') || name.includes('almond') || name.includes('peanut')) return '🥜';
  return locationEmoji(p.location);
}

function expiryInfo(dateStr) {
  if (!dateStr) return { label: 'Set date', cls: 'no-date', days: null };
  const now = new Date(); now.setHours(0,0,0,0);
  const exp = new Date(dateStr + 'T00:00:00');
  const days = Math.round((exp - now) / 86400000);
  if (days < 0) return { label: `Expired ${-days}d ago`, cls: 'expired', days };
  if (days === 0) return { label: 'Expires today!', cls: 'expired', days };
  if (days <= 7) return { label: `${days}d left`, cls: 'expiring', days };
  return { label: exp.toLocaleDateString('en-US', {month:'short', day:'numeric'}), cls: 'fresh', days };
}

function getLocations() {
  const locs = ['all', ...new Set(products.map(p => (p.location || 'pantry').toLowerCase()))].sort((a,b) => a==='all'?-1:b==='all'?1:a.localeCompare(b));
  const counts = {};
  products.forEach(p => { const l = (p.location||'pantry').toLowerCase(); counts[l] = (counts[l]||0)+1; counts['all']=(counts['all']||0)+1; });
  return locs.map(l => ({ id: l, count: counts[l] || 0 }));
}

function capitalize(s) { return s ? s[0].toUpperCase() + s.slice(1) : ''; }

function filteredProducts() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let ps = products.filter(p => {
    if (currentTab !== 'all' && (p.location||'pantry').toLowerCase() !== currentTab) return false;
    if (currentCategory !== 'all' && (p.user_category || 'Other') !== currentCategory) return false;
    if (q) {
      const hay = `${p.name} ${p.brand} ${p.location} ${p.barcode} ${p.user_category||''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    // Stat filter
    if (activeStatFilter) {
      if (activeStatFilter === 'expiring') {
        if (!p.expiration_date) return false;
        return expiryInfo(p.expiration_date).cls === 'expiring';
      }
      if (activeStatFilter === 'expired') {
        if (!p.expiration_date) return false;
        return expiryInfo(p.expiration_date).cls === 'expired';
      }
      if (activeStatFilter === 'nodate') return !p.expiration_date;
    }
    return true;
  });
  ps = sortProducts(ps);
  return ps;
}

// Products filtered by location only (for category counts)
function locationFilteredProducts() {
  return products.filter(p => {
    if (currentTab !== 'all' && (p.location||'pantry').toLowerCase() !== currentTab) return false;
    return true;
  });
}

function sortProducts(ps) {
  const s = currentSort;
  const dir = sortDirection[s] || 'asc';
  const mul = dir === 'asc' ? 1 : -1;
  return [...ps].sort((a,b) => {
    if (s === 'name') return mul * (a.name||'').localeCompare(b.name||'');
    if (s === 'expiry') {
      if (!a.expiration_date && !b.expiration_date) return 0;
      if (!a.expiration_date) return 1; // no date always last
      if (!b.expiration_date) return -1;
      return mul * a.expiration_date.localeCompare(b.expiration_date);
    }
    if (s === 'recent') return mul * (a.last_scanned||'').localeCompare(b.last_scanned||'');
    if (s === 'qty') return mul * ((a.quantity_count||0) - (b.quantity_count||0));
    return 0;
  });
}

function getStats() {
  let total = products.length, expiring = 0, expired = 0, noDate = 0;
  products.forEach(p => {
    if (!p.expiration_date) { noDate++; return; }
    const info = expiryInfo(p.expiration_date);
    if (info.cls === 'expired') expired++;
    else if (info.cls === 'expiring') expiring++;
  });
  return { total, expiring, expired, noDate };
}

function render() {
  renderTabs();
  renderCatBar();
  renderContent();
  renderStats();
  renderSidebar();
}

/* ── Sidebar render ── */
function renderSidebar() {
  const stats = getStats();

  // Update subtitle
  const sub = document.getElementById('sidebarSubtitle');
  if (sub) sub.textContent = `${stats.total} items · ${stats.expiring} expiring`;

  // Update stat values
  const sv = n => document.getElementById(n);
  if (sv('sidebarStatTotalVal')) sv('sidebarStatTotalVal').textContent = stats.total;
  if (sv('sidebarStatExpiringVal')) sv('sidebarStatExpiringVal').textContent = stats.expiring;
  if (sv('sidebarStatExpiredVal')) sv('sidebarStatExpiredVal').textContent = stats.expired;
  if (sv('sidebarStatNoDatVal')) sv('sidebarStatNoDatVal').textContent = stats.noDate;

  // Location list
  const locList = document.getElementById('sidebarLocList');
  if (locList) {
    const locs = getLocations();
    locList.innerHTML = locs.map(loc => {
      const label = loc.id === 'all' ? 'All Locations' : capitalize(loc.id);
      const emoji = loc.id === 'all' ? '🏠' : locationEmoji(loc.id);
      const active = currentTab === loc.id;
      return `<button class="sidebar-loc-item${active ? ' active' : ''}" onclick="setTabFromSidebar('${loc.id}')">
        <span class="sidebar-loc-bar"></span>
        <span class="sidebar-loc-label">${emoji} ${label}</span>
        <span class="sidebar-loc-count">${loc.count}</span>
      </button>`;
    }).join('');
  }

  // Category list
  const catList = document.getElementById('sidebarCatList');
  if (catList) {
    const locFiltered = locationFilteredProducts();
    const counts = {};
    locFiltered.forEach(p => { const c = p.user_category || 'Other'; counts[c] = (counts[c] || 0) + 1; });
    const total = locFiltered.length;

    let html = `<button class="sidebar-cat-item${currentCategory === 'all' ? ' active' : ''}" onclick="setCategoryFromSidebar('all')">
      <span class="sidebar-cat-bar" style="background:#5B8C5A"></span>
      <span class="sidebar-cat-label">All Categories</span>
      <span class="sidebar-cat-count">${total}</span>
    </button>`;

    CATEGORIES.forEach(cat => {
      const count = counts[cat.id] || 0;
      if (count === 0) return;
      const active = currentCategory === cat.id;
      html += `<button class="sidebar-cat-item${active ? ' active' : ''}" onclick="setCategoryFromSidebar('${cat.id.replace(/'/g, "\\'")}')">
        <span class="sidebar-cat-bar" style="background:${cat.barColor}"></span>
        <span class="sidebar-cat-label">${cat.emoji} ${cat.id}</span>
        <span class="sidebar-cat-count">${count}</span>
      </button>`;
    });
    catList.innerHTML = html;
  }

  // Sync sidebar sort buttons with direction arrows
  syncSidebarSortArrows();
}

function setTabFromSidebar(id) {
  currentTab = id;
  currentCategory = 'all';
  closeSidebar();
  render();
}

function setCategoryFromSidebar(cat) {
  if (currentCategory === cat && cat !== 'all') {
    currentCategory = 'all';
  } else {
    currentCategory = cat;
  }
  closeSidebar();
  render();
}

function setSortSidebar(s, btn) {
  if (currentSort === s) {
    sortDirection[s] = sortDirection[s] === 'asc' ? 'desc' : 'asc';
  } else {
    currentSort = s;
  }
  // Sync header sort buttons
  document.querySelectorAll('.sort-btn').forEach(b => {
    const isActive = b.dataset.sort === currentSort;
    b.classList.toggle('active', isActive);
    let arrow = b.querySelector('.sort-arrow');
    if (!arrow) { arrow = document.createElement('span'); arrow.className = 'sort-arrow'; b.appendChild(arrow); }
    arrow.textContent = isActive ? (sortDirection[currentSort] === 'asc' ? '▲' : '▼') : '';
  });
  syncSidebarSortArrows();
  render();
}

/* ── Tablet sidebar toggle ── */
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

/* ── Mobile/tablet renders ── */
function renderCatBar() {
  const bar = document.getElementById('catBar');
  const locFiltered = locationFilteredProducts();
  const counts = {};
  locFiltered.forEach(p => {
    const c = p.user_category || 'Other';
    counts[c] = (counts[c] || 0) + 1;
  });

  const total = locFiltered.length;
  let html = `<button class="cat-pill${currentCategory === 'all' ? ' active' : ''}" data-cat="all" onclick="setCategory('all')">All (${total})</button>`;

  CATEGORIES.forEach(cat => {
    const count = counts[cat.id] || 0;
    if (count === 0) return;
    html += `<button class="cat-pill${currentCategory === cat.id ? ' active' : ''}" data-cat="${escAttr(cat.id)}" onclick="setCategory('${cat.id.replace(/'/g, "\\'")}')"> ${cat.emoji} ${cat.id} (${count})</button>`;
  });

  bar.innerHTML = html;
}

function setCategory(cat) {
  if (currentCategory === cat && cat !== 'all') {
    currentCategory = 'all';
  } else {
    currentCategory = cat;
  }
  render();
}

function setStatFilter(filter) {
  // 'all' clears the filter; clicking same filter again also clears
  if (filter === 'all' || activeStatFilter === filter) {
    activeStatFilter = null;
  } else {
    activeStatFilter = filter;
  }
  render();
}

function escAttr(s) { return s.replace(/"/g, '&quot;'); }

function renderStats() {
  const { total, expiring, expired, noDate } = getStats();
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statExpiring').textContent = expiring;
  document.getElementById('statExpired').textContent = expired;
  document.getElementById('statNoDate').textContent = noDate;
  // Highlight active stat filter
  ['statFilterAll','statFilterExpiring','statFilterExpired','statFilterNoDate'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove('active-filter');
  });
  const filterMap = { expiring: 'statFilterExpiring', expired: 'statFilterExpired', nodate: 'statFilterNoDate' };
  if (activeStatFilter && filterMap[activeStatFilter]) {
    const el = document.getElementById(filterMap[activeStatFilter]);
    if (el) el.classList.add('active-filter');
  }
}

function renderTabs() {
  const t = document.getElementById('tabs');
  const locs = getLocations();
  t.innerHTML = locs.map(loc => {
    const label = loc.id === 'all'
      ? `All (${loc.count})`
      : `${locationEmoji(loc.id)} ${capitalize(loc.id)} (${loc.count})`;
    return `<button class="tab${loc.id===currentTab?' active':''}" onclick="setTab('${loc.id}')">${label}</button>`;
  }).join('');
}

function renderSkeletonCards(n) {
  return Array.from({length: n}, () => `
    <div class="skeleton-card">
      <div class="skeleton-block skeleton-emoji"></div>
      <div class="skeleton-lines">
        <div class="skeleton-block skeleton-line-name"></div>
        <div class="skeleton-block skeleton-line-brand"></div>
        <div class="skeleton-block skeleton-line-badge"></div>
      </div>
    </div>`).join('');
}

function renderContent() {
  const content = document.getElementById('content');

  // Loading state: show skeleton cards
  if (isLoading) {
    content.innerHTML = `<div class="products-grid">${renderSkeletonCards(6)}</div>`;
    return;
  }

  // Error state
  if (loadError) {
    content.innerHTML = `<div class="error-state">
      <span class="emoji">⚠️</span>
      <h3>Couldn't load your pantry</h3>
      <p>Check that the server is running, or try again.</p>
      <button class="retry-btn" onclick="loadPantry()">🔄 Retry</button>
    </div>`;
    return;
  }

  // True empty (no products at all)
  if (products.length === 0) {
    content.innerHTML = `<div class="empty-state">
      <span class="emoji">🛒</span>
      <h3>Your pantry is empty</h3>
      <p>Scan a barcode or tap + to add your first item</p>
      <button class="empty-cta" onclick="openAddModal()">+ Add Item</button>
    </div>`;
    return;
  }

  const ps = filteredProducts();

  if (ps.length === 0) {
    content.innerHTML = `<div class="empty-state"><span class="emoji">🔍</span><h3>No items found</h3><p>Try adjusting your filters or search</p></div>`;
    return;
  }

  // Expiring/expired section
  const urgent = ps.filter(p => {
    if (!p.expiration_date) return false;
    const info = expiryInfo(p.expiration_date);
    return info.cls === 'expiring' || info.cls === 'expired';
  });

  const nonUrgent = ps.filter(p => {
    if (!p.expiration_date) return true;
    const info = expiryInfo(p.expiration_date);
    return info.cls !== 'expiring' && info.cls !== 'expired';
  });

  let html = '';

  if (urgent.length > 0) {
    html += `<div class="section-heading expiring-heading">⚠️ Expiring Soon (${urgent.length})</div>`;
    html += `<div class="products-grid">${urgent.map(p => cardHTML(p, true)).join('')}</div>`;
  }

  if (currentTab === 'all') {
    const byLoc = {};
    nonUrgent.forEach(p => {
      const l = capitalize(p.location || 'pantry');
      if (!byLoc[l]) byLoc[l] = [];
      byLoc[l].push(p);
    });
    for (const [loc, items] of Object.entries(byLoc).sort(([a],[b]) => a.localeCompare(b))) {
      html += `<div class="section-heading">${locationEmoji(loc.toLowerCase())} ${loc} (${items.length})</div>`;
      html += `<div class="products-grid">${items.map(p => cardHTML(p, false)).join('')}</div>`;
    }
  } else {
    if (nonUrgent.length > 0) {
      html += `<div class="products-grid">${nonUrgent.map(p => cardHTML(p, false)).join('')}</div>`;
    }
  }

  content.innerHTML = html;
}

function catBadgeHTML(p) {
  const cat = p.user_category || 'Other';
  const info = getCategoryInfo(cat);
  const dropdownId = `catdrop-${p.barcode}`;
  const isOpen = openDropdownBarcode === p.barcode;

  const dropdownItems = CATEGORIES.map(c =>
    `<div class="cat-dropdown-item${c.id === cat ? ' selected' : ''}" onclick="selectCategory('${p.barcode}','${c.id}',event)">
      <span class="cat-dot" style="background:${c.barColor}"></span>
      ${c.emoji} ${c.id}
    </div>`
  ).join('');

  return `<span class="cat-badge" data-cat="${escAttr(cat)}" onclick="toggleCatDropdown('${p.barcode}',event)" title="Change category">
    ${info.emoji} ${cat}
    <div class="cat-dropdown${isOpen ? ' open' : ''}" id="${dropdownId}">
      ${dropdownItems}
    </div>
  </span>`;
}

const LOCATIONS = [
  { id: 'pantry', label: 'Pantry', emoji: '🥫' },
  { id: 'fridge', label: 'Fridge', emoji: '❄️' },
  { id: 'freezer', label: 'Freezer', emoji: '🧊' },
  { id: 'spice rack', label: 'Spice Rack', emoji: '🌿' },
];

function locBadgeHTML(p) {
  const locId = (p.location || 'pantry').toLowerCase();
  const locInfo = LOCATIONS.find(l => l.id === locId) || { id: locId, label: capitalize(locId), emoji: '📦' };
  const isOpen = openLocationDropdownBarcode === p.barcode;
  const dropdownItems = LOCATIONS.map(l =>
    `<div class="loc-dropdown-item${l.id === locId ? ' selected' : ''}" onclick="selectLocation('${p.barcode}','${l.id}',event)">
      ${l.emoji} ${l.label}
    </div>`
  ).join('');
  return `<span class="loc-badge-wrap" onclick="toggleLocDropdown('${p.barcode}',event)">
    <span class="loc-badge" style="cursor:pointer" title="Change location">${locInfo.emoji} ${locInfo.label}</span>
    <div class="loc-dropdown${isOpen ? ' open' : ''}">
      ${dropdownItems}
    </div>
  </span>`;
}

function toggleLocDropdown(barcode, event) {
  event.stopPropagation();
  if (openLocationDropdownBarcode === barcode) {
    openLocationDropdownBarcode = null;
  } else {
    openLocationDropdownBarcode = barcode;
  }
  render();
}

async function selectLocation(barcode, locId, event) {
  event.stopPropagation();
  const p = products.find(p => p.barcode === barcode);
  if (!p) return;
  p.location = locId;
  openLocationDropdownBarcode = null;
  render();
  await patch(barcode, { location: locId });
  toast(`Moved to ${capitalize(locId)}`);
}

function toggleCatDropdown(barcode, event) {
  event.stopPropagation();
  if (openDropdownBarcode === barcode) {
    openDropdownBarcode = null;
  } else {
    openDropdownBarcode = barcode;
  }
  render();
}

async function selectCategory(barcode, catId, event) {
  event.stopPropagation();
  const p = products.find(p => p.barcode === barcode);
  if (!p) return;
  p.user_category = catId;
  p.category_source = 'manual';
  openDropdownBarcode = null;
  render();
  await patch(barcode, { user_category: catId, category_source: 'manual' });
  toast(`Category set to ${catId}`);
}

function cardHTML(p, isUrgent) {
  const info = expiryInfo(p.expiration_date);
  const isDone = p.quantity_count <= 0;
  const expanded = expandedCards.has(p.barcode);
  let cls = 'card';
  if (isDone) cls += ' done-card';
  else if (info.cls === 'expiring' && !isUrgent) cls += ' expiring-card';
  else if (info.cls === 'expired') cls += ' expired-card';

  // Nutrition: only show non-null fields; hide entire section if all null
  const n = p.nutrition || {};
  const nutritionFields = [
    { key: 'calories_per_100g', label: 'cal', fmt: v => Math.round(v) },
    { key: 'protein_per_100g', label: 'protein', fmt: v => v.toFixed(1)+'g' },
    { key: 'fat_per_100g', label: 'fat', fmt: v => v.toFixed(1)+'g' },
    { key: 'carbs_per_100g', label: 'carbs', fmt: v => v.toFixed(1)+'g' },
    { key: 'sugar_per_100g', label: 'sugar', fmt: v => v.toFixed(1)+'g' },
    { key: 'sodium_per_100g', label: 'sodium', fmt: v => (v*1000).toFixed(0)+'mg' },
  ];
  const validNutrition = nutritionFields.filter(f => n[f.key] != null);
  const hasNutrition = validNutrition.length > 0;
  const hasIngredients = !!(p.ingredients && p.ingredients.trim());

  let detailHTML = '';
  if (hasNutrition) {
    const nutItems = validNutrition.map(f =>
      `<div class="nutrition-item"><div class="val">${f.fmt(n[f.key])}</div><div class="lbl">${f.label}</div></div>`
    ).join('');
    detailHTML += `<div class="detail-section">
      <div class="detail-label">Nutrition (per 100g)</div>
      <div class="nutrition-grid">${nutItems}</div>
    </div>`;
  }
  if (hasIngredients) {
    detailHTML += `<div class="detail-section">
      <div class="detail-label">Ingredients</div>
      <div class="ingredients-text">${p.ingredients}</div>
    </div>`;
  }
  if (!hasNutrition && !hasIngredients) {
    detailHTML += `<div class="detail-section" style="color:var(--text-muted);font-style:italic;font-size:13px">No product details available</div>`;
  }
  if (p.serving_size) {
    detailHTML += `<div class="detail-section"><span class="detail-label">Serving:</span> ${p.serving_size}</div>`;
  }
  if (p.quantity) {
    detailHTML += `<div class="detail-section"><span class="detail-label">Package:</span> ${p.quantity}</div>`;
  }
  detailHTML += `<div class="detail-actions">
    <button class="detail-btn danger" onclick="deleteProduct('${p.barcode}',event)">🗑 Delete</button>
    <button class="detail-btn" onclick="toggleLocDropdown('${p.barcode}',event)">📍 Location</button>
  </div>`;

  return `<div class="${cls}" id="card-${p.barcode}">
    <div class="card-main" onclick="toggleExpand('${p.barcode}')">
      <div class="card-emoji">${productEmoji(p)}</div>
      <div class="card-info">
        <div class="card-name">${p.name || 'Unknown'}</div>
        ${p.brand ? `<div class="card-brand">${p.brand}</div>` : ''}
        <div class="card-sub">
          ${catBadgeHTML(p)}
          ${locBadgeHTML(p)}
          ${isDone ? `<span class="oos-badge">Out of stock</span>` : ''}
        </div>
      </div>
      <div class="card-controls" onclick="event.stopPropagation()">
        <button class="qty-btn" onclick="changeQty('${p.barcode}',-1)">−</button>
        <span class="qty-display">${p.quantity_count || 0}</span>
        <button class="qty-btn" onclick="changeQty('${p.barcode}',1)">+</button>
        <div class="done-check${isDone?' checked':''}" onclick="toggleDone('${p.barcode}')" title="${isDone?'Mark in stock':'Mark out of stock'}">
          ${isDone?'✓':''}
        </div>
      </div>
    </div>
    <div class="expiry-row" onclick="event.stopPropagation()">
      <span class="expiry-badge ${info.cls}" onclick="openDatePicker('${p.barcode}',this)">${info.label}</span>
      <input type="date" class="expiry-input" id="datepicker-${p.barcode}" style="display:none"
        value="${p.expiration_date||''}"
        onchange="saveExpiry('${p.barcode}',this.value)"
        onblur="this.style.display='none'">
    </div>
    <div class="card-detail${expanded?' open':''}" id="detail-${p.barcode}">
      ${detailHTML || '<div style="color:var(--muted);padding:8px 0">No additional info available</div>'}
    </div>
  </div>`;
}

function toggleExpand(barcode) {
  if (expandedCards.has(barcode)) expandedCards.delete(barcode);
  else expandedCards.add(barcode);
  render();
}

function openDatePicker(barcode, badge) {
  const input = document.getElementById('datepicker-' + barcode);
  if (!input) return;
  input.style.display = 'inline-block';
  badge.style.display = 'none';
  input.focus();
  input.addEventListener('blur', () => {
    badge.style.display = '';
  }, { once: true });
}

async function saveExpiry(barcode, value) {
  const p = products.find(p => p.barcode === barcode);
  if (!p) return;
  p.expiration_date = value || null;
  await patch(barcode, { expiration_date: value || null });
  render();
  toast('Expiry saved');
}

async function changeQty(barcode, delta) {
  const p = products.find(p => p.barcode === barcode);
  if (!p) return;
  const newQty = Math.max(0, (p.quantity_count || 0) + delta);
  p.quantity_count = newQty;
  updateCardQty(barcode, newQty);
  await patch(barcode, { quantity_count: newQty });
}

function updateCardQty(barcode, qty) {
  // Re-render the full card for out-of-stock badge accuracy
  const p = products.find(p => p.barcode === barcode);
  if (p) render();
}

async function toggleDone(barcode) {
  const p = products.find(p => p.barcode === barcode);
  if (!p) return;
  const newQty = p.quantity_count > 0 ? 0 : 1;
  p.quantity_count = newQty;
  await patch(barcode, { quantity_count: newQty });
  render();
}

async function deleteProduct(barcode, event) {
  event.stopPropagation();
  if (!confirm('Remove this item from your pantry?')) return;
  products = products.filter(p => p.barcode !== barcode);
  render();
  try {
    await fetch(`${API}/api/pantry/${encodeURIComponent(barcode)}`, { method: 'DELETE' });
    toast('Item removed');
  } catch(e) { toast('Error removing item'); loadPantry(); }
}

// editLocation() replaced by locBadgeHTML dropdown (Phase 4)

async function patch(barcode, fields) {
  try {
    const res = await fetch(`${API}/api/pantry/${encodeURIComponent(barcode)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(fields)
    });
    if (!res.ok) console.error('PATCH failed', res.status);
  } catch(e) { console.error('PATCH error', e); }
}

function setTab(id) {
  currentTab = id;
  currentCategory = 'all';
  render();
}

function setSort(s, btn) {
  if (currentSort === s) {
    // Toggle direction
    sortDirection[s] = sortDirection[s] === 'asc' ? 'desc' : 'asc';
  } else {
    currentSort = s;
  }
  // Update arrows on header sort buttons
  document.querySelectorAll('.sort-btn').forEach(b => {
    b.classList.remove('active');
    const arrow = b.querySelector('.sort-arrow');
    if (arrow) arrow.textContent = '';
  });
  btn.classList.add('active');
  let arrow = btn.querySelector('.sort-arrow');
  if (!arrow) { arrow = document.createElement('span'); arrow.className = 'sort-arrow'; btn.appendChild(arrow); }
  arrow.textContent = sortDirection[s] === 'asc' ? '▲' : '▼';
  // Sync sidebar
  syncSidebarSortArrows();
  render();
}

function syncSidebarSortArrows() {
  document.querySelectorAll('.sidebar-sort-btn').forEach(b => {
    const isActive = b.dataset.sort === currentSort;
    b.classList.toggle('active', isActive);
    let arrow = b.querySelector('.sort-arrow');
    if (!arrow) { arrow = document.createElement('span'); arrow.className = 'sort-arrow'; b.appendChild(arrow); }
    arrow.textContent = isActive ? (sortDirection[currentSort] === 'asc' ? '▲' : '▼') : '';
  });
}

function openAddModal() {
  document.getElementById('addModal').classList.add('open');
  document.getElementById('addName').focus();
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
  ['addName','addBrand','addBarcode'].forEach(id => document.getElementById(id).value='');
  document.getElementById('addQty').value = '1';
  document.getElementById('addExpiry').value = '';
  document.getElementById('addCategory').value = 'Other';
}

async function submitAdd() {
  const name = document.getElementById('addName').value.trim();
  if (!name) { document.getElementById('addName').focus(); return; }
  const payload = {
    name,
    brand: document.getElementById('addBrand').value.trim(),
    quantity_count: parseInt(document.getElementById('addQty').value) || 1,
    location: document.getElementById('addLocation').value,
    expiration_date: document.getElementById('addExpiry').value || null,
    barcode: document.getElementById('addBarcode').value.trim() || undefined,
    user_category: document.getElementById('addCategory').value || 'Other',
    category_source: 'manual',
  };
  try {
    const res = await fetch(`${API}/api/pantry`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.ok) {
      closeAddModal();
      await loadPantry();
      toast(`✅ ${name} added`);
    } else {
      toast('Error: ' + (data.error || 'Failed'));
    }
  } catch(e) { toast('Network error'); }
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

async function loadPantry() {
  isLoading = true;
  loadError = null;
  renderContent(); // show skeleton immediately
  try {
    const res = await fetch(`${API}/api/pantry`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    products = data.products || [];
    isLoading = false;
    render();
  } catch(e) {
    console.error('Failed to load pantry', e);
    isLoading = false;
    loadError = e.message || 'Network error';
    renderContent(); // show error state
  }
}

// Auto-refresh every 60s
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    await loadPantry();
    scheduleRefresh();
  }, 60000);
}

// Init
loadPantry().then(scheduleRefresh);

// Close dropdowns when clicking outside
document.addEventListener('click', () => {
  let changed = false;
  if (openDropdownBarcode !== null) { openDropdownBarcode = null; changed = true; }
  if (openLocationDropdownBarcode !== null) { openLocationDropdownBarcode = null; changed = true; }
  if (changed) render();
});

// Handle keyboard shortcut for add
document.addEventListener('keydown', e => {
  if (e.key === 'n' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT') {
    openAddModal();
  }
});
</script>
